<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step by step form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#EAF3EE;
    --bg-2:#ECEDFB;
    --card:#FFFFFF;
    --ink:#1E2430;
    --muted:#6B7280;
    --primary:#1F6F5C;
    --primary-dark:#17594A;
    --accent:#E1A94C;
    --border:#E3E6EA;
    --radius:20px;
    --shadow:0 20px 60px -20px rgba(30,36,48,0.28);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:linear-gradient(135deg,var(--bg-1),var(--bg-2));
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
  }

  .card{
    width:100%;
    max-width:460px;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:40px 36px;
  }

  /* ---- progress indicator ---- */
  .progress{ margin-bottom:32px; }
  .progress-track{
    height:4px;
    background:var(--border);
    border-radius:999px;
    margin-bottom:18px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--primary),var(--accent));
    border-radius:999px;
    transition:width .35s ease;
  }
  .progress-steps{
    list-style:none;
    display:flex;
    justify-content:space-between;
    margin:0;
    padding:0;
  }
  .progress-step{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--muted);
  }
  .dot{
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--border);
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:600;
    font-size:12px;
    transition:background .25s, color .25s;
  }
  .progress-step.active .dot{ background:var(--primary); color:#fff; }
  .progress-step.completed .dot{ background:var(--accent); color:#fff; }
  .progress-step.active .label{ color:var(--ink); font-weight:600; }

  /* ---- steps ---- */
  .step{ animation:fadeSlide .35s ease; }
  @keyframes fadeSlide{
    from{ opacity:0; transform:translateX(14px); }
    to{ opacity:1; transform:translateX(0); }
  }
  @media (prefers-reduced-motion:reduce){ .step{ animation:none; } }

  h1{
    font-family:'Fraunces',serif;
    font-size:26px;
    font-weight:600;
    margin:0 0 6px;
  }
  .subtitle{
    color:var(--muted);
    font-size:14px;
    margin:0 0 26px;
  }

  .field{ margin-bottom:18px; }
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
  }
  .field input,
  .field textarea{
    width:100%;
    padding:12px 14px;
    font-family:inherit;
    font-size:15px;
    color:var(--ink);
    border:1.5px solid var(--border);
    border-radius:10px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
    resize:vertical;
  }
  .field input:focus,
  .field textarea:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(31,111,92,0.14);
  }

  .actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
  }

  .btn{
    padding:12px 22px;
    border-radius:10px;
    font-family:inherit;
    font-weight:600;
    font-size:15px;
    border:none;
    cursor:pointer;
    transition:transform .12s, background .15s, border-color .15s, color .15s;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-primary:hover{ background:var(--primary-dark); }
  .btn-ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--border); }
  .btn-ghost:hover{ border-color:var(--primary); color:var(--primary); }

  /* ---- success screen ---- */
  .success{ text-align:center; }
  .success-icon{
    width:52px;
    height:52px;
    margin:0 auto 18px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
  }
  .summary{
    text-align:left;
    display:grid;
    grid-template-columns:auto 1fr;
    gap:4px 14px;
    margin:24px 0 28px;
  }
  .summary dt{
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.03em;
    align-self:start;
    padding-top:2px;
  }
  .summary dd{
    margin:0;
    font-size:15px;
    padding-bottom:6px;
  }
  .success .btn-primary{ width:100%; }

  @media (max-width:480px){
    .card{ padding:30px 22px; }
    h1{ font-size:22px; }
  }
</style>
</head>
<body>

<div class="card">

  <div class="progress" id="progress">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <ol class="progress-steps">
      <li class="progress-step" data-step="1"><span class="dot">1</span><span class="label">You</span></li>
      <li class="progress-step" data-step="2"><span class="dot">2</span><span class="label">Contact</span></li>
      <li class="progress-step" data-step="3"><span class="dot">3</span><span class="label">Notes</span></li>
    </ol>
  </div>

  <form id="wizard" novalidate>

    <section class="step" data-step="1">
      <h1>Let's start with you</h1>
      <p class="subtitle">Just the basics.</p>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" required placeholder="Jordan Lee">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="jordan@example.com">
      </div>
      <div class="actions">
        <span></span>
        <button type="button" class="btn btn-primary next-btn">Next</button>
      </div>
    </section>

    <section class="step" data-step="2" hidden>
      <h1>How can we reach you</h1>
      <p class="subtitle">We'll only use this if needed.</p>
      <div class="field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" required placeholder="+91 98765 43210">
      </div>
      <div class="field">
        <label for="city">City</label>
        <input type="text" id="city" name="city" required placeholder="Chennai">
      </div>
      <div class="actions">
        <button type="button" class="btn btn-ghost back-btn">Back</button>
        <button type="button" class="btn btn-primary next-btn">Next</button>
      </div>
    </section>

    <section class="step" data-step="3" hidden>
      <h1>Anything else?</h1>
      <p class="subtitle">Optional — add a note if you'd like.</p>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" placeholder="Write a note..."></textarea>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-ghost back-btn">Back</button>
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </section>

  </form>

  <div class="success" id="success" hidden aria-live="polite">
    <div class="success-icon">✓</div>
    <h1 id="successHeading">Thanks!</h1>
    <p class="subtitle">Here's what you told us.</p>
    <dl class="summary" id="summary"></dl>
    <button type="button" class="btn btn-primary" id="restartBtn">Start over</button>
  </div>

</div>

<script>
  const steps = Array.from(document.querySelectorAll('.step'));
  const progressSteps = Array.from(document.querySelectorAll('.progress-step'));
  const progressFill = document.getElementById('progressFill');
  const progressBar = document.getElementById('progress');
  const form = document.getElementById('wizard');
  const success = document.getElementById('success');
  const summary = document.getElementById('summary');
  const successHeading = document.getElementById('successHeading');

  const total = steps.length;
  let current = 1;

  function showStep(n){
    steps.forEach(s => { s.hidden = Number(s.dataset.step) !== n; });
    progressSteps.forEach(p => {
      const num = Number(p.dataset.step);
      p.classList.toggle('active', num === n);
      p.classList.toggle('completed', num < n);
    });
    progressFill.style.width = ((n - 1) / (total - 1)) * 100 + '%';
    current = n;

    const activeStep = steps.find(s => Number(s.dataset.step) === n);
    const firstField = activeStep && activeStep.querySelector('input, textarea');
    if (firstField) firstField.focus({ preventScroll: true });
  }

  function validateStep(stepEl){
    const fields = stepEl.querySelectorAll('input[required], textarea[required]');
    for (const field of fields){
      if (!field.checkValidity()){
        field.reportValidity();
        return false;
      }
    }
    return true;
  }

  document.querySelectorAll('.next-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const stepEl = btn.closest('.step');
      if (validateStep(stepEl)) showStep(current + 1);
    });
  });

  document.querySelectorAll('.back-btn').forEach(btn => {
    btn.addEventListener('click', () => showStep(current - 1));
  });

  // Enter key on steps 1–2 acts like clicking Next, instead of doing nothing
  form.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && current < total && e.target.tagName !== 'TEXTAREA'){
      e.preventDefault();
      const stepEl = steps.find(s => Number(s.dataset.step) === current);
      if (validateStep(stepEl)) showStep(current + 1);
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const stepEl = steps.find(s => Number(s.dataset.step) === current);
    if (!validateStep(stepEl)) return;

    const data = new FormData(form);
    summary.innerHTML = '';
    form.querySelectorAll('input, textarea').forEach(field => {
      const value = (data.get(field.name) || '').toString().trim();
      if (!value) return;
      const labelEl = form.querySelector(`label[for="${field.id}"]`);
      const dt = document.createElement('dt');
      dt.textContent = labelEl ? labelEl.textContent : field.name;
      const dd = document.createElement('dd');
      dd.textContent = value;
      summary.appendChild(dt);
      summary.appendChild(dd);
    });

    const name = (data.get('name') || '').toString().trim();
    successHeading.textContent = name ? `Thanks, ${name.split(' ')[0]}!` : 'Thanks!';

    form.hidden = true;
    progressBar.hidden = true;
    success.hidden = false;
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    form.reset();
    form.hidden = false;
    progressBar.hidden = false;
    success.hidden = true;
    showStep(1);
  });

  // init
  showStep(1);
</script>

</body>
</html>
