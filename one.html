<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website One</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 300px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            color: #555;
            font-weight: 500;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Website One</h1>
        <form>
            <div class="form-group">
                <label for="input1">Field 1:</label>
                <input type="text" id="input1" placeholder="Enter value">
            </div>
            <div class="form-group">
                <label for="input2">Field 2:</label>
                <input type="text" id="input2" placeholder="Enter value">
            </div>
            <div class="form-group">
                <label for="input3">Field 3:</label>
                <input type="text" id="input3" placeholder="Enter value">
            </div>
            <div class="form-group">
                <label for="input4">Field 4:</label>
                <input type="text" id="input4" placeholder="Enter value">
            </div>
            <div class="form-group">
                <label for="input5">Field 5:</label>
                <input type="text" id="input5" placeholder="Enter value">
            </div>
        </form>
    </div>
</body>
</html>
